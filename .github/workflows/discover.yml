name: discover-links
on: workflow_dispatch
jobs:
  find:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt && python discover.py de-de nl-nl nl-be fr-be de-at fr-fr en-ie it-it es-es pt-pt en-gb
